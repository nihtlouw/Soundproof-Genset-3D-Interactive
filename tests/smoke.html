<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uji regresi rumah wiremesh</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; padding: 0 1rem; max-width: 800px; background: #10181a; color: #edf2ea; }
    button { padding: .6rem 1rem; border: 0; border-radius: .5rem; background: #c6f75c; color: #10181a; cursor: pointer; }
    li { margin: .4rem 0; }
    .pass { color: #c6f75c; }
    .fail { color: #ff9180; }
    iframe { width: 420px; height: 450px; max-width: 100%; border: 1px solid #344744; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Uji regresi rumah wiremesh</h1>
  <p>Jalankan melalui server statis dan browser yang mendukung WebGL. Pengujian memuat ulang aplikasi beberapa kali.</p>
  <button id="run" type="button">Jalankan lagi</button>
  <p id="summary" role="status">Menyiapkan pengujian…</p>
  <ol id="results"></ol>
  <iframe id="app" title="Aplikasi yang diuji"></iframe>
  <script src="smoke.js"></script>
</body>
</html>
